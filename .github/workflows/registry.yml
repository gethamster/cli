name: MCP Registry

# Kept separate from the plugin package workflow: a plugin release is a version
# in plugin.json on main and a tag left unused costs nothing, while a registry
# version is published once and can never be edited afterwards, so publishing
# here is a deliberate manual action. The metadata gates run here too rather
# than as steps in plugin.yml so registry validation reports as its own status
# check.
on:
  push:
  pull_request:
  # The registry entry names a version the deployment must actually report, and
  # nothing in this repository changes the deployment, so the drift can only be
  # caught by asking the endpoint on a timer.
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "server.json version to publish (only read when publishing)"
        required: false
        type: string
      publish:
        description: "Publish to the official MCP Registry (leave off to only run the gates)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run registry metadata tests
        run: node --test scripts/test-registry.mjs
      - name: Validate server.json
        run: node scripts/validate-registry.mjs

  conformance:
    name: Remote connector conformance
    # No push to this repository changes the deployed server, so running this
    # per-push would redden unrelated pull requests during a production OAuth
    # incident and catch nothing this repository caused. It also needs a
    # workspace token, which a fork cannot have.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Exercise the published endpoint
        env:
          HAMSTER_MCP_TOKEN: ${{ secrets.HAMSTER_MCP_CONFORMANCE_TOKEN }}
        run: node scripts/verify-connector.mjs
      # The deployment check above proves the server reports server.json's
      # version; this proves the registry lists it. Without it a version bumped,
      # deployed, and never dispatched for publishing stays unlisted silently. A
      # dispatch run skips this because it may be the publish that closes the gap.
      - name: Confirm the committed version is listed in the registry
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          version="$(jq -r '.version' server.json)"
          name="$(jq -r '.name' server.json)"
          body="$(curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers/${name//\//%2F}/versions")"
          if ! echo "$body" | jq -e --arg v "$version" '.servers | any(.server.version == $v)' >/dev/null; then
            echo "server.json is at $version but the registry does not list it; dispatch this workflow with publish=true." >&2
            exit 1
          fi
          echo "$name $version is listed in the registry."

  publish:
    name: Publish to the official registry
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [validate, conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dispatcher types the version they believe they are shipping. A
      # mismatch means the checkout is not the release they think it is. The
      # name is read from the same file so the registry lookups below cannot
      # drift from what gets published.
      - name: Confirm the requested version is the committed one
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          committed="$(jq -r '.version' server.json)"
          if [ "$committed" != "$REQUESTED" ]; then
            echo "server.json is at $committed but the run requested ${REQUESTED:-<empty>}" >&2
            exit 1
          fi
          name="$(jq -r '.name' server.json)"
          {
            echo "version=$committed"
            echo "server_name=$name"
            echo "server_name_encoded=${name//\//%2F}"
          } >> "$GITHUB_ENV"

      # Published versions are immutable, so a re-run of an already published
      # version is reported and skipped rather than failed. A 404 is the
      # unpublished-server case; any other failure must not look like one.
      - name: Skip if this version is already published
        run: |
          set -euo pipefail
          status="$(curl -sS -o versions.json -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/${server_name_encoded}/versions")"
          case "$status" in
            200) ;;
            404) echo '{}' > versions.json ;;
            *) echo "registry versions lookup returned HTTP $status" >&2; exit 1 ;;
          esac
          published="$(jq -r --arg v "$version" '.servers // [] | any(.server.version == $v)' versions.json)"
          if [ "$published" = true ]; then
            echo "$server_name $version is already published; nothing to do."
            echo "already_published=true" >> "$GITHUB_ENV"
          else
            echo "already_published=false" >> "$GITHUB_ENV"
          fi

      # The com.tryhamster namespace is authorized by a key served from the
      # domain by a different repository. Assert it is reachable before asking
      # the registry to fetch it, so a missing deploy fails here with the URL
      # rather than inside an authentication error.
      - name: Confirm the domain proof is live
        if: env.already_published == 'false'
        run: |
          set -euo pipefail
          proof="$(curl -fsS https://tryhamster.com/.well-known/mcp-registry-auth)"
          case "$proof" in
            "v=MCPv1; k=ed25519; p="*) echo "domain proof is live" ;;
            *) echo "unexpected proof document: $proof" >&2; exit 1 ;;
          esac

      - name: Install mcp-publisher
        if: env.already_published == 'false'
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # The local validator owns the Hamster-specific rules; this checks the
      # same file against the live registry schema, which can tighten without
      # this repository noticing.
      - name: Validate server.json against the registry
        if: env.already_published == 'false'
        run: ./mcp-publisher validate

      # Domain authentication: the registry fetches the public key from
      # https://tryhamster.com/.well-known/mcp-registry-auth and accepts any
      # signature from the matching private key, so that key lives only in this
      # repository's secrets.
      - name: Authenticate to the registry
        if: env.already_published == 'false'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: ./mcp-publisher login http --domain tryhamster.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Publish server.json
        if: env.already_published == 'false'
        run: ./mcp-publisher publish

      - name: Confirm the version is live
        if: env.already_published == 'false'
        run: |
          set -euo pipefail
          body="$(curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers/${server_name_encoded}/versions")"
          echo "$body" | jq -e --arg v "$version" '.servers | any(.server.version == $v)' >/dev/null
          echo "$server_name $version is live."
